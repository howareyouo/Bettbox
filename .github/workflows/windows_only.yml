name: windows-only sync & build

# 单一流水线，三种触发：push 到 main / 每天一次 cron / 手动（Actions 页 Run workflow）
#   sync job：对比 main HEAD 与 windows-only 分支记录的 .source-sha，
#             有变化（或 push/手动强制）则从 main 重建 windows-only 分支
#   build job：构建 Windows 安装包并发布 Release
# windows-only = main 裁剪版（delete_manifest + 手工补丁），与上游同步发生在
# 「rebase main」时，CI 不感知上游。
on:
  schedule:
    - cron: '17 21 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if main unchanged (manual verification)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# 串行化，避免 cron 与 push 两个 run 并发 force-push windows-only 分支
concurrency:
  group: windows-only-pipeline
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild windows-only from main
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      flutter_version: ${{ steps.fver.outputs.flutter_version }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch windows-only branch
        run: git fetch origin windows-only || true

      - name: Check for main changes
        id: check
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          LAST_SHA=$(git show origin/windows-only:.source-sha 2>/dev/null || echo "none")
          echo "last_sha=$LAST_SHA"
          if [ "$LAST_SHA" = "$SOURCE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes since last build (still $SOURCE_SHA)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "main changed: $LAST_SHA -> $SOURCE_SHA"
          fi

      # 跟随上游:main rebase 上游时 CI(build.yaml) pin 的 Flutter 版本随 main 走,
      # 权威版本即 main 上的 build.yaml。解析失败时兜底读 pubspec environment.flutter;
      # 仍失败回退默认值并打 warning,不静默用错版本。
      # SDK/构建缓存 key 含版本号,版本没变则缓存照常命中,稳态不受影响。
      - name: Detect Flutter version
        id: fver
        run: |
          V=$(grep -E 'flutter-version:' .github/workflows/build.yaml 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9x]+\.[0-9x]+' | tail -n 1)
          if [ -z "$V" ]; then
            V=$(sed -n '/^environment:/,/^[^ ]/p' pubspec.yaml 2>/dev/null \
                | grep -E 'flutter:' \
                | grep -oE '[0-9]+(\.[0-9x]+)+' | tail -n 1)
          fi
          if [ -z "$V" ]; then
            V='3.47.7'
            echo "::warning::Failed to detect Flutter version, falling back to ${V}"
          fi
          echo "Flutter version: ${V}"
          echo "flutter_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Run windows-only rebuild script
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_build == 'true'
        run: |
          chmod +x windows_only/build_windows_only.sh
          windows_only/build_windows_only.sh main windows-only-rebuild
          git push --force origin windows-only-rebuild:windows-only

  build:
    name: Build for Windows
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_build == 'true'
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout windows-only branch
        uses: actions/checkout@v7
        with:
          ref: windows-only
          fetch-depth: 1

      - name: Setup Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 版本号由 sync job 从 main 的 build.yaml pin 解析(fver 步骤),rebase 上游时自动跟进;
          # 缓存 key 含解析出的 VERSION,版本不变则命中不变。
          flutter-version: ${{ needs.sync.outputs.flutter_version }}
          cache: true

      - name: Setup Rust (Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        if: github.event.inputs.force_build != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          key: windows-only-helper

      - name: Enable Git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          echo "go=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "core=$(git rev-parse HEAD:core)" >> "$GITHUB_OUTPUT"
          echo "helper=$(git rev-parse HEAD:services/helper)" >> "$GITHUB_OUTPUT"
          echo "lib=$(git rev-parse HEAD:lib)" >> "$GITHUB_OUTPUT"
          echo "windows=$(git rev-parse HEAD:windows)" >> "$GITHUB_OUTPUT"
          echo "assets=$(git rev-parse HEAD:assets)" >> "$GITHUB_OUTPUT"
          echo "plugins=$(git rev-parse HEAD:plugins)" >> "$GITHUB_OUTPUT"
          echo "arb=$(git rev-parse HEAD:arb)" >> "$GITHUB_OUTPUT"
          echo "lock=$(git rev-parse HEAD:pubspec.lock)" >> "$GITHUB_OUTPUT"
          echo "pubspec=$(git rev-parse HEAD:pubspec.yaml)" >> "$GITHUB_OUTPUT"
          echo "buildyaml=$(git rev-parse HEAD:build.yaml)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        id: go
        if: github.event.inputs.force_build != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\gocache
          key: gocache-${{ hashFiles('core/go.sum') }}-${{ steps.keys.outputs.go }}
          restore-keys: |
            gocache-

      - name: Restore Core+Helper cache
        id: clash
        if: github.event.inputs.force_build != 'true'
        uses: actions/cache/restore@v4
        with:
          path: libclash/windows
          key: libclash-${{ steps.keys.outputs.core }}-${{ steps.keys.outputs.helper }}-${{ steps.keys.outputs.go }}-${{ steps.keys.outputs.rust }}

      - name: Prepare Flutter deps
        shell: bash
        run: flutter pub get

      - name: Patch sing-tun for Windows
        if: steps.clash.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}\gocache
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      - name: Build Core (Windows)
        if: steps.clash.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}\gocache
        run: dart setup.dart windows --arch amd64 --out core-only

      - name: Build HelperService (Windows)
        if: steps.clash.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}\gocache
        run: |
          CORE_HASH=$(sha256sum libclash/windows/BettboxCore.exe | awk '{print $1}')
          echo "Core SHA256 (TOKEN for Helper): $CORE_HASH"
          dart setup.dart windows --arch amd64 --out helper --core-hash "$CORE_HASH"

      - name: Compute Core hash
        id: corehash
        shell: bash
        run: |
          CORE_HASH=$(sha256sum libclash/windows/BettboxCore.exe | awk '{print $1}')
          echo "core_hash=$CORE_HASH" >> "$GITHUB_OUTPUT"
          echo "Core SHA256: $CORE_HASH"

      - name: Restore Flutter build cache
        id: fb
        if: github.event.inputs.force_build != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .dart_tool
            build/windows
          key: flutter-${{ steps.flutter.outputs.VERSION }}-${{ steps.corehash.outputs.core_hash }}-${{ steps.keys.outputs.lib }}-${{ steps.keys.outputs.windows }}-${{ steps.keys.outputs.assets }}-${{ steps.keys.outputs.plugins }}-${{ steps.keys.outputs.arb }}-${{ steps.keys.outputs.lock }}-${{ steps.keys.outputs.pubspec }}-${{ steps.keys.outputs.buildyaml }}
          # 前缀复用：同 Flutter 版本 + 同 core（CORE_SHA256 未变）时，
          # 用最近一次的 build/windows 做 CMake/MSVC 增量编译；
          # restore 命中不算 cache-hit，build 步骤照跑，产物正确性不受影响
          restore-keys: |
            flutter-${{ steps.flutter.outputs.VERSION }}-${{ steps.corehash.outputs.core_hash }}-

      - name: Build Bettbox (Windows)
        if: steps.fb.outputs.cache-hit != 'true'
        shell: bash
        run: |
          dart run build_runner build
          flutter build windows --release \
            --dart-define=CORE_SHA256=${{ steps.corehash.outputs.core_hash }} \
            --dart-define=APP_ENV=stable

      - name: Save Go build cache
        if: success() && github.event.inputs.force_build != 'true' && steps.clash.outputs.cache-hit != 'true' && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\gocache
          key: gocache-${{ hashFiles('core/go.sum') }}-${{ steps.keys.outputs.go }}

      - name: Save Core+Helper cache
        if: success() && github.event.inputs.force_build != 'true' && steps.clash.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libclash/windows
          key: libclash-${{ steps.keys.outputs.core }}-${{ steps.keys.outputs.helper }}-${{ steps.keys.outputs.go }}-${{ steps.keys.outputs.rust }}

      - name: Save Flutter build cache
        if: success() && github.event.inputs.force_build != 'true' && steps.fb.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .dart_tool
            build/windows
          key: flutter-${{ steps.flutter.outputs.VERSION }}-${{ steps.corehash.outputs.core_hash }}-${{ steps.keys.outputs.lib }}-${{ steps.keys.outputs.windows }}-${{ steps.keys.outputs.assets }}-${{ steps.keys.outputs.plugins }}-${{ steps.keys.outputs.arb }}-${{ steps.keys.outputs.lock }}-${{ steps.keys.outputs.pubspec }}-${{ steps.keys.outputs.buildyaml }}

      - name: Package zip
        run: |
          $src = "build\windows\x64\runner\Release"
          $zip = "Bettbox-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          echo "ARTIFACT=$zip" >> $env:GITHUB_ENV

      # 注意：不要给 zip 上传 actions artifact——GitHub 下载 artifact 时会再套一层
      # 同名 zip（双层 zip，Windows 下解压冲突），Release 即唯一分发渠道。
      - name: Create GitHub Release
        run: |
          $tag = "windows-only-$env:SOURCE_SHA"
          gh release create "$tag" "$env:ARTIFACT" `
            --title "Bettbox Windows-only (main@$($env:SOURCE_SHA.Substring(0,8)))" `
            --notes "Automatically rebuilt from fork main @ $env:SOURCE_SHA`nWindows-only build with mobile platform code removed." `
            --repo "$env:GITHUB_REPOSITORY" || `
            gh release upload "$tag" "$env:ARTIFACT" --repo "$env:GITHUB_REPOSITORY" --clobber || true