name: windows-only sync & build

# 每 2 小时检查一次上游；也可手动触发（Actions 页 Run workflow）
on:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if upstream unchanged (manual verification)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    name: Rebuild windows-only from upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/appshubcc/Bettbox.git
          git fetch --depth=200 upstream main
          git fetch origin windows-only || true

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          LAST_SHA=$(git show origin/windows-only:.upstream-sha 2>/dev/null || echo "none")
          echo "last_sha=$LAST_SHA"
          if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes (still $UPSTREAM_SHA)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed: $LAST_SHA -> $UPSTREAM_SHA"
          fi

      - name: Auto-export patches from main
        id: export
        run: |
          chmod +x windows_only/auto_export.sh
          result=$(windows_only/auto_export.sh upstream/main)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "$result"

      - name: Run windows-only rebuild script
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_build == 'true'
        run: |
          chmod +x windows_only/build_windows_only.sh
          windows_only/build_windows_only.sh upstream/main windows-only-rebuild
          git push --force origin windows-only-rebuild:windows-only

  build:
    name: Build Windows installer
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || github.event.inputs.force_build == 'true'
    runs-on: windows-latest
    env:
      UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout windows-only branch
        uses: actions/checkout@v7
        with:
          ref: windows-only
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust (Windows)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Patch sing-tun for Windows
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"

      - name: Build Core (Windows)
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart windows --arch amd64 --out core-only

      - name: Build HelperService (Windows)
        shell: bash
        run: |
          CORE_HASH=$(sha256sum libclash/windows/BettboxCore.exe | awk '{print $1}')
          echo "Core SHA256 (TOKEN for Helper): $CORE_HASH"
          dart setup.dart windows --arch amd64 --out helper --core-hash "$CORE_HASH"

      - name: Build Bettbox (Windows)
        shell: bash
        run: |
          CORE_HASH=$(sha256sum libclash/windows/BettboxCore.exe | awk '{print $1}')
          echo "Core SHA256: $CORE_HASH"
          flutter build windows --release --verbose \
            --dart-define=CORE_SHA256=$CORE_HASH \
            --dart-define=APP_ENV=stable

      - name: Package zip
        run: |
          $src = "build\windows\x64\runner\Release"
          $zip = "Bettbox-windows-only-$env:UPSTREAM_SHA.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          echo "ARTIFACT=$zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bettbox-windows-only-${{ env.UPSTREAM_SHA }}
          path: Bettbox-windows-only-*.zip

      - name: Create GitHub Release
        run: |
          $tag = "windows-only-$env:UPSTREAM_SHA"
          gh release create "$tag" "$env:ARTIFACT" `
            --title "Bettbox Windows-only (upstream $($env:UPSTREAM_SHA.Substring(0,8)))" `
            --notes "Automatically rebuilt from upstream main @ $env:UPSTREAM_SHA`nWindows-only build with mobile platform code removed." `
            --repo "$env:GITHUB_REPOSITORY" || `
            gh release upload "$tag" "$env:ARTIFACT" --repo "$env:GITHUB_REPOSITORY" --clobber || true